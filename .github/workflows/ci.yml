name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  design-contract:
    name: Shared Design Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify generated tokens and screen parity
        run: python scripts/generate_design_contract.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Test and build web app
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Create CI-only debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build Release APK (assembleRelease)
        env:
          PCOSINA_ALLOW_INSECURE_RELEASE_SIGNING: "true"
        run: ./gradlew assembleRelease

      - name: Upload Android release build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-artifacts
          path: |
            app/build/outputs/apk/release/*
            app/build/outputs/logs/*
            app/build/outputs/sdk-dependencies/release/*
          if-no-files-found: warn

  connected-instrumentation:
    name: Connected Instrumentation (API ${{ matrix.api-level }}, Pinned Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run full connected instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_4
          locale: en_US
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale 1.0
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload connected instrumentation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-instrumentation-artifacts-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**/*
            app/build/outputs/androidTest-results/connected/**/*
            app/build/outputs/connected_android_test_additional_output/**/*
          if-no-files-found: warn

  compact-visual-regression:
    name: Compact Visual Regression (API ${{ matrix.api-level }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run compact visual tests (strict verify before refresh)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_4
          locale: en_US
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale 1.0
            if [ -f app/src/androidTest/assets/visual_baselines/compact_profile_step3.png ] && [ -f app/src/androidTest/assets/visual_baselines/compact_chip_row.png ] && [ -f app/src/androidTest/assets/visual_baselines/compact_dashboard_today_outcome.png ] && [ -f app/src/androidTest/assets/visual_baselines/compact_progress_top_section.png ] && [ -f app/src/androidTest/assets/visual_baselines/compact_mealplan_top_section.png ]; then
              ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pcosina.app.CompactWidthVisualRegressionTest -Pandroid.testInstrumentationRunnerArguments.require_visual_baseline=true -Pandroid.testInstrumentationRunnerArguments.visual_delta_threshold=6.0

              ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pcosina.app.CompactWidthVisualRegressionTest -Pandroid.testInstrumentationRunnerArguments.refresh_visual_baseline=true
            else
              echo "Full compact baseline set not committed yet; strict verify skipped."
              ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pcosina.app.CompactWidthVisualRegressionTest -Pandroid.testInstrumentationRunnerArguments.refresh_visual_baseline=true
            fi

      - name: Upload compact visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-visual-regression-artifacts-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**/*
            app/build/outputs/androidTest-results/connected/**/*
            app/build/outputs/connected_android_test_additional_output/**/*
          if-no-files-found: warn

  ux-critical-flow:
    name: UX Critical Flow Gates (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run current core and reminder critical instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_4
          locale: en_US
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale 1.0
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pcosina.app.CurrentCoreFlowUiTest
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pcosina.app.MealPlanSwapBannerUiTest#statusCenter_showsReminderSummaryWhenNotificationsEnabled

      - name: Upload UX critical flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-critical-flow-artifacts-api-34
          path: |
            app/build/reports/androidTests/connected/**/*
            app/build/outputs/androidTest-results/connected/**/*
            app/build/outputs/connected_android_test_additional_output/**/*
          if-no-files-found: warn

  backend-smoke:
    name: Backend Dependency Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../ml/offline_training/requirements.txt

      - name: Run backend test suite
        working-directory: backend
        env:
          PCOSINA_ENV: development
        run: |
          python -m coverage run -m pytest -q --junitxml=pytest-report.xml
          python -m coverage xml -o coverage.xml
          python -m coverage report --skip-covered

      - name: Upload backend smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-evidence
          path: |
            backend/pytest-report.xml
            backend/coverage.xml
          if-no-files-found: warn

  ml-readiness:
    name: ML Readiness Gates
    runs-on: ubuntu-latest
    env:
      ML_FRESHNESS_MAX_AGE_HOURS: "720"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/offline_training/requirements.txt

      - name: Run ML runtime and artifact tests
        env:
          PCOSINA_ENV: development
        run: |
          python -m pytest backend/tests/test_ml_ranker.py backend/tests/test_lightgbm_training.py backend/tests/test_ml_readiness_script.py backend/tests/test_meal_planner.py -q

      - name: Run ML readiness gates
        run: |
          python scripts/check_ml_readiness.py \
            --mode shadow \
            --reason-feedback-summary ml/offline_training/artifacts/reason_feedback_v1/reason_feedback_summary.json \
            --max-dataset-artifact-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-dataset-source-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-reason-feedback-artifact-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-reason-feedback-source-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS"
          python scripts/check_ml_readiness.py \
            --mode canary \
            --reason-feedback-summary ml/offline_training/artifacts/reason_feedback_v1/reason_feedback_summary.json \
            --max-dataset-artifact-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-dataset-source-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-reason-feedback-artifact-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS" \
            --max-reason-feedback-source-age-hours "$ML_FRESHNESS_MAX_AGE_HOURS"

      - name: Upload ML readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-readiness-evidence
          path: |
            ml/offline_training/artifacts/dataset_v1/dataset_manifest.json
            ml/offline_training/artifacts/model_v1/training_metrics.json
            ml/offline_training/artifacts/model_v1/cohort_metrics.csv
            ml/offline_training/artifacts/model_v1/request_confusion.csv
            ml/offline_training/artifacts/model_v1/cohort_regression_request_confusion.csv
            ml/offline_training/artifacts/reason_feedback_v1/reason_feedback_summary.json
          if-no-files-found: error

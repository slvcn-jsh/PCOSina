name: Codecov Backend Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/codecov-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/codecov-backend.yml"

permissions:
  contents: read

jobs:
  backend-coverage:
    name: Python backend tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn

      - name: Run backend tests and create coverage XML
        env:
          PCOSINA_ENV: development
          PYTHONPATH: backend
        run: |
          set +e
          python -m coverage run --source=backend -m pytest backend/tests -q --junitxml=backend/pytest-report.xml
          test_exit_code=$?
          set -e
          python -m coverage xml -o backend/coverage.xml
          python -m coverage report --skip-covered
          echo "TEST_EXIT_CODE=$test_exit_code" >> "$GITHUB_ENV"
          if [ "$test_exit_code" -ne 0 ]; then
            echo "::warning::Backend tests reported failures. Coverage will still be uploaded for inspection."
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          name: pcosina-backend
          fail_ci_if_error: true

      - name: Enforce backend test results
        if: always() && env.TEST_EXIT_CODE != ''
        run: |
          if [ "$TEST_EXIT_CODE" -ne 0 ]; then
            echo "::error::Backend tests failed (exit code $TEST_EXIT_CODE). Review test artifacts and logs."
            exit "$TEST_EXIT_CODE"
          fi

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-evidence
          path: |
            backend/pytest-report.xml
            backend/coverage.xml
          if-no-files-found: warn

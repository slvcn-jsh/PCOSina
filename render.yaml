databases:
  - name: pcosina-postgres
    databaseName: pcosina
    user: pcosina
    plan: basic-256mb

services:
  - type: redis
    name: pcosina-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: pcosina-backend
    runtime: python
    branch: dev
    pythonVersion: 3.12.8
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python deploy_bootstrap.py
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -t 120 --access-logfile - --error-logfile - -b 0.0.0.0:$PORT main:app
    healthCheckPath: /health/ready
    envVars:
      - key: PCOSINA_ENV
        value: production
      - key: PCOSINA_ENABLE_DOCS
        value: "false"
      - key: PCOSINA_ALLOWED_HOSTS
        value: pcosina-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pcosina-postgres
          property: connectionString
      - key: PCOSINA_REDIS_URL
        fromService:
          type: redis
          name: pcosina-redis
          property: connectionString
      - key: PCOSINA_QUEUE_BACKEND
        value: redis
      - key: PCOSINA_RATE_LIMIT_BACKEND
        value: redis
      - key: PCOSINA_ENFORCE_APP_CHECK
        value: "true"
      - key: PCOSINA_ASYNC_MODE
        value: queued
      - key: PCOSINA_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PCOSINA_RATE_LIMIT_MAX
        value: "60"
      - key: PCOSINA_BOOTSTRAP_ON_STARTUP
        value: "false"
      - key: PCOSINA_DB_POOL_MIN_SIZE
        value: "1"
      - key: PCOSINA_DB_POOL_MAX_SIZE
        value: "4"
      - key: PCOSINA_DB_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: PCOSINA_ADMIN_SESSION_SECRET
        generateValue: true
      - key: PCOSINA_UID_HASH_SALT
        sync: false
      - key: PCOSINA_WEBHOOK_RECEIVER_KEY
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PCOSINA_FIREBASE_WEB_API_KEY
        sync: false
      - key: PCOSINA_FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: PCOSINA_FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: PCOSINA_FIREBASE_WEB_APP_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: pcosina-worker
    runtime: python
    branch: dev
    pythonVersion: 3.12.8
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker_plan_jobs.py
    envVars:
      - key: PCOSINA_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pcosina-postgres
          property: connectionString
      - key: PCOSINA_REDIS_URL
        fromService:
          type: redis
          name: pcosina-redis
          property: connectionString
      - key: PCOSINA_QUEUE_BACKEND
        value: redis
      - key: PCOSINA_ENFORCE_APP_CHECK
        value: "true"
      - key: PCOSINA_UID_HASH_SALT
        sync: false
      - key: PCOSINA_WORKER_RUN_FOREVER
        value: "true"
      - key: PCOSINA_BOOTSTRAP_ON_STARTUP
        value: "false"
      - key: PCOSINA_DB_POOL_MIN_SIZE
        value: "1"
      - key: PCOSINA_DB_POOL_MAX_SIZE
        value: "2"
      - key: PCOSINA_DB_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
